<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d0d">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Character Creator — Deviluke AI</title>
  <link rel="stylesheet" href="css/style.css?v=51">
  <link rel="icon" href="d.ai.png?v=51">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="splash-screen" id="splashScreen">
    <img src="deviluke-banner.png" alt="Deviluke AI" class="splash-logo" id="splashLogo" style="opacity:0">
  </div>
  <script>
    (function() {
      var logo = document.getElementById("splashLogo");
      if (!logo) return;
      try {
        var s = JSON.parse(localStorage.getItem("deviluke_settings"));
        if (s && s.accentColor) {
          var hex = s.accentColor;
          var r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
          var max = Math.max(r,g,b), min = Math.min(r,g,b), h = 0;
          if (max !== min) {
            var d = max - min;
            if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
            else if (max === g) h = ((b - r) / d + 2) / 6;
            else h = ((r - g) / d + 4) / 6;
          }
          logo.style.filter = "hue-rotate(" + Math.round(h * 360) + "deg) saturate(1.3) brightness(1.05)";
        }
      } catch(e) {}
      logo.classList.add("tinted");
    })();
  </script>

  <aside class="left-sidebar">
    <a href="index.html" class="left-sidebar-logo">Deviluke AI</a>
    <nav class="left-sidebar-nav">
      <a href="index.html" class="left-sidebar-link">Characters</a>
      <a href="chat.html" class="left-sidebar-link">Chat</a>
      <a href="personas.html" class="left-sidebar-link">Personas</a>
      <a href="create.html" class="left-sidebar-link">Create</a>
      <a href="my-bots.html" class="left-sidebar-link">My Bots</a>
      <a href="download.html" class="left-sidebar-link">Download App</a>
    </nav>
  </aside>

  <nav class="navbar">
    <div class="nav-inner">
      <span id="navUser"></span>
      <span id="syncStatus"></span>
      <div class="lang-dropdown">
        <button class="lang-btn" onclick="toggleLangDropdown()" title="Change Language">🌐</button>
        <div class="lang-dropdown-menu" id="langDropdown">
          <input type="text" id="langSearch" placeholder="Search language..." onkeyup="filterLangs()">
          <div class="lang-list" id="langList">
            <button onclick="setLanguage('en')">English</button>
            <button onclick="setLanguage('es')">Spanish</button>
            <button onclick="setLanguage('fr')">French</button>
            <button onclick="setLanguage('de')">German</button>
            <button onclick="setLanguage('it')">Italian</button>
            <button onclick="setLanguage('pt')">Portuguese</button>
            <button onclick="setLanguage('ru')">Russian</button>
            <button onclick="setLanguage('ja')">Japanese</button>
            <button onclick="setLanguage('ko')">Korean</button>
            <button onclick="setLanguage('zh-CN')">Chinese (Simplified)</button>
            <button onclick="setLanguage('ar')">Arabic</button>
            <button onclick="setLanguage('hi')">Hindi</button>
          </div>
        </div>
      </div>
      <button class="settings-btn" onclick="openSettings()" title="Settings">⚙️</button>
    </div>
  </nav>

  <div class="creator-profile" id="creatorPage">
    <div class="creator-profile-header" id="creatorHeader">
      <div class="creator-avatar-fallback" id="creatorAvatarFallback">?</div>
      <img class="creator-avatar" id="creatorAvatar" src="" alt="" style="display:none">
      <div class="creator-profile-info">
        <h1 class="creator-profile-name" id="creatorName">...</h1>
        <p class="creator-profile-bio" id="creatorBio">Character creator</p>
        </div>
        <div class="creator-profile-actions">
          <button class="btn btn-secondary" id="followBtn" style="font-size:0.85rem" onclick="toggleFollow()">Follow</button>
          <a href="index.html" class="btn btn-secondary" style="font-size:0.85rem">&larr; Back</a>
      </div>
    </div>

    <div class="creator-bots-section">
      <h2 class="creator-bots-title" id="creatorBotsTitle">Characters</h2>
      <div class="my-bots-grid" id="creatorGrid"></div>
    </div>

    <div class="my-bots-empty" id="creatorEmpty" style="display:none">
      <div class="my-bots-empty-icon">🔮</div>
      <h2>No characters found</h2>
      <p>No characters by this creator yet.</p>
      <a href="index.html" class="btn btn-primary" style="margin-top:20px">Browse All Characters</a>
    </div>
  </div>

  <footer class="footer">
    <p>Deviluke AI &mdash; 18+ only. All characters are fictional. &copy; 2026</p>
  </footer>

  <script src="js/app-main.js?v=51"></script>
  <script>
    var _currentCreator = "";

    function renderCreatorPage() {
      var params = new URLSearchParams(location.search);
      var creator = params.get("creator");
      _currentCreator = creator;
      if (!creator) {
        document.getElementById("creatorName").textContent = "No creator specified";
        document.getElementById("creatorBotsTitle").textContent = "";
        document.getElementById("creatorGrid").style.display = "none";
        return;
      }

      document.title = creator + " — Creator Profile | Deviluke AI";

      var all = [];
      if (typeof defaultCharacters !== "undefined") {
        all = all.concat(defaultCharacters);
      }
      try {
        var customs = JSON.parse(localStorage.getItem("deviluke_characters"));
        if (Array.isArray(customs)) all = all.concat(customs);
      } catch(e) {}

      var chars = all.filter(function(c) { return c.creator === creator; });
      if (!settings.nsfwEnabled) {
        chars = chars.filter(function(c) { return !c.tags || !c.tags.includes("nsfw"); });
      }

      chars.sort(function(a, b) {
        var popA = getTotalMsgs(a.id);
        var popB = getTotalMsgs(b.id);
        if (popA !== popB) return popB - popA;
        return a.id > b.id ? 1 : -1;
      });

      // Set profile
      document.getElementById("creatorName").textContent = creator;

      // Avatar: use first character's image if available
      if (chars.length > 0 && chars[0].imageUrl) {
        var av = document.getElementById("creatorAvatar");
        var fb = document.getElementById("creatorAvatarFallback");
        av.src = chars[0].imageUrl;
        av.alt = creator;
        av.style.display = "block";
        fb.style.display = "none";
        av.onerror = function() {
          av.style.display = "none";
          fb.style.display = "flex";
          fb.textContent = creator.charAt(0).toUpperCase();
        };
      } else {
        document.getElementById("creatorAvatarFallback").textContent = creator.charAt(0).toUpperCase();
      }

      // Stats and follow button
      document.getElementById("creatorBotsTitle").textContent = "Characters (" + chars.length + ")";

      // Follow button
      var fbBtn = document.getElementById("followBtn");
      var isOwnPage = currentUser && (currentUser.name === creator || (typeof isAdminUser === "function" && isAdminUser() && creator === "Deviluke"));
      if (typeof isFollowingCreator === "function" && !isOwnPage) {
        fbBtn.style.display = "inline-block";
        fbBtn.textContent = isFollowingCreator(creator) ? "Unfollow" : "Follow";
      } else {
        fbBtn.style.display = "none";
      }

      var grid = document.getElementById("creatorGrid");
      var empty = document.getElementById("creatorEmpty");

      if (!chars.length) {
        grid.style.display = "none";
        empty.style.display = "flex";
        return;
      }

      grid.style.display = "grid";
      empty.style.display = "none";

      grid.innerHTML = chars.map(function(c) {
        var img = c.imageUrl
          ? '<img src="' + c.imageUrl + '" alt="' + c.name.replace(/"/g,"&quot;") + '" class="my-bot-card-img" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
          : "";
        var fallback = '<div class="my-bot-card-fallback" style="display:' + (c.imageUrl ? "none" : "flex") + ";background:" + (c.color || "var(--accent)") + '">' + (c.avatar || c.name.charAt(0).toUpperCase()) + "</div>";
        var tags = (c.tags || []).slice(0,3).map(function(t) { return '<span class="my-bot-tag">' + t + "</span>"; }).join("");
        var count = getTotalMsgs(c.id);
        var countText = count + " message" + (count !== 1 ? "s" : "") + " total";

        return '<div class="my-bot-card">'
          + '<div class="my-bot-card-media">'
            + img + fallback
            + '<div class="my-bot-card-color-bar" style="background:' + (c.color || "var(--accent)") + '"></div>'
          + "</div>"
          + '<div class="my-bot-card-body">'
            + '<h3 class="my-bot-card-name" style="color:var(--accent)">' + c.name + "</h3>"
            + '<p class="my-bot-card-desc">' + (c.description || "") + "</p>"
            + '<div class="my-bot-card-tags">' + tags + "</div>"
            + '<div class="chat-count" style="margin-top:8px;font-size:0.8rem;color:var(--text-muted)">' + countText + "</div>"
          + "</div>"
          + '<div class="my-bot-card-actions">'
            + '<a href="chat.html?char=' + c.id + '" class="btn btn-primary my-bot-action-btn">Chat</a>'
          + "</div>"
        + "</div>";
      }).join("");
    }

    function toggleFollow() {
      if (typeof toggleFollowCreator !== "function" || !_currentCreator) return;
      var nowFollowing = toggleFollowCreator(_currentCreator);
      document.getElementById("followBtn").textContent = nowFollowing ? "Unfollow" : "Follow";
    }

    document.addEventListener("DOMContentLoaded", function() {
      loadSettings();
      applySettings();
      renderCreatorPage();
    });
  </script>

</body>
</html>
